<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Alianis Reyes-Reyes — Quality Data Engineer</title>
  <desc id="desc">Modern centered professional header with teal, blue, and purple gradient glow and sleek typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0d152e"/>
      <stop offset="100%" stop-color="#140c28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2aa8ad"/>
      <stop offset="50%" stop-color="#4b82d0"/>
      <stop offset="100%" stop-color="#7842df"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4b82d0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4b82d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#2aa8ad" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2aa8ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#7842df" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7842df" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowTop)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowLeft)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowRight)"/>

  <path d="M0 270 C 320 220, 640 310, 960 250 C 1120 220, 1200 260, 1280 240 L 1280 320 L 0 320 Z" fill="url(#accent)" opacity="0.08"/>
  <path d="M0 290 C 280 250, 600 315, 920 275 C 1100 250, 1200 285, 1280 270" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.45"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="80" fill="#91a3c0" font-size="13" font-weight="700" letter-spacing="4">PORTFOLIO · 2026</text>
    <text x="640" y="148" fill="#ffffff" font-size="52" font-weight="800" letter-spacing="-0.5">Alianis Reyes-Reyes</text>
    <rect x="490" y="168" width="300" height="3.5" rx="1.75" fill="url(#accent)" filter="url(#blurGlow)"/>
    <text x="640" y="216" fill="#dce6f8" font-size="22" font-weight="600" letter-spacing="0.5">Quality Data Engineer · GxP Systems &amp; CSV</text>
    <text x="640" y="252" fill="#8aa0bf" font-size="14" font-weight="500" letter-spacing="2">DATA ENGINEERING · ANALYTICS AUTOMATION · IT COMPLIANCE</text>
  </g>

  <rect x="1.5" y="1.5" width="1277" height="317" rx="22.5" fill="none" stroke="url(#accent)" stroke-opacity="0.35" stroke-width="2"/>
</svg>