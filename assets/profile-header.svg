<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Alianis Reyes-Reyes - Data Engineering, Quality and IT Systems</title>
  <desc id="desc">Modern minimal portfolio header with gradient background and animated typing role specialties.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.5" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#090c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa8ad"/>
      <stop offset="0.5" stop-color="#4b82d0"/>
      <stop offset="1" stop-color="#7842df"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4b82d0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4b82d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2aa8ad" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2aa8ad" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#91a3c0" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>

  <circle cx="1080" cy="40" r="220" fill="url(#glow1)">
    <animate attributeName="r" values="210;235;210" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="300" r="200" fill="url(#glow2)">
    <animate attributeName="r" values="190;215;190" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="80" y="92" fill="#8aa0bf" font-size="15" font-weight="700" letter-spacing="4">PORTFOLIO &#8226; 2026</text>

    <text x="80" y="152" fill="#f4f7fb" font-size="52" font-weight="800" letter-spacing="0.3">Alianis Reyes-Reyes</text>

    <line x1="80" y1="178" x2="80" y2="178" stroke="url(#accent)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="x2" values="80;720;720" keyTimes="0;0.7;1" dur="2s" fill="freeze"/>
    </line>

    <g fill="#d7e0f0" font-size="25" font-weight="600">
      <text x="80" y="222">Quality Data Engineer &#8226; GxP Systems &amp; CSV
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.3;0.35" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="222" opacity="0">Full-Stack &amp; Data Pipeline Engineering
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.63;0.68" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="222" opacity="0">Automation, AI &amp; Compliance Enablement
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.73;0.97;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="80" y="264" fill="#91a3c0" font-size="15" letter-spacing="1.1">UPRM &#8226; ELI LILLY EXPERIENCE &#8226; GxP VALIDATION &#8226; PUERTO RICO</text>
    <text x="80" y="294" fill="#42c3c8" font-size="14" font-weight="700" letter-spacing="2">ENGINEERING TRUST INTO DATA, SYSTEMS AND DECISIONS</text>
  </g>

  <rect x="1.5" y="1.5" width="1277" height="317" rx="22.5" fill="none" stroke="url(#accent)" stroke-opacity="0.38" stroke-width="2.5"/>
</svg>
