<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">Alianis Reyes-Reyes — Quality Data Engineer</title>
  <desc id="desc">Modern professional header with teal, blue, and purple gradient waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081322"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#160f32"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa8ad"/>
      <stop offset="0.52" stop-color="#4b82d0"/>
      <stop offset="1" stop-color="#7842df"/>
    </linearGradient>
    <linearGradient id="waveSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa8ad" stop-opacity="0.08"/>
      <stop offset="0.52" stop-color="#4b82d0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7842df" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="300" rx="26" fill="url(#bg)"/>
  <path d="M0 227 C150 174 256 266 414 216 C574 164 699 250 844 205 C1000 156 1110 237 1280 175 L1280 300 L0 300 Z" fill="url(#waveSoft)"/>
  <path d="M0 249 C178 194 286 284 443 235 C590 189 704 266 862 221 C1028 174 1138 244 1280 191" fill="none" stroke="url(#wave)" stroke-opacity="0.8" stroke-width="3"/>
  <path d="M0 266 C154 218 294 292 459 251 C604 215 723 280 884 241 C1035 204 1151 261 1280 223" fill="none" stroke="url(#wave)" stroke-opacity="0.32" stroke-width="2"/>
  <circle cx="1112" cy="73" r="92" fill="#7842df" opacity="0.10"/>
  <circle cx="1190" cy="42" r="44" fill="#4b82d0" opacity="0.14" filter="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="80" y="77" fill="#91a3c0" font-size="14" font-weight="700" letter-spacing="4">PORTFOLIO · 2026</text>
    <text x="80" y="138" fill="#f7f9ff" font-size="52" font-weight="800">Alianis Reyes-Reyes</text>
    <rect x="80" y="158" width="514" height="4" rx="2" fill="url(#wave)"/>
    <text x="80" y="206" fill="#dce6f8" font-size="24" font-weight="600">Quality Data Engineer · GxP Systems &amp; CSV</text>
