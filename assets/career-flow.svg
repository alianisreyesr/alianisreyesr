<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Career signal from systems foundations to measurable impact</title>
  <desc id="desc">An animated four-stage professional pathway covering systems, data products, quality governance and measurable impact.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081321"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa8ad"/><stop offset="0.52" stop-color="#4b82d0"/><stop offset="1" stop-color="#7842df"/></linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1.5" y="1.5" width="1277" height="277" rx="24" fill="url(#panel)" stroke="#2b3b62" stroke-width="3"/>
  <text x="70" y="58" fill="#8fa4c3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CAREER SIGNAL</text>
  <text x="70" y="91" fill="#f4f7fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">From technical foundations to trusted decisions</text>
  <path id="route" d="M155 166 C320 112 370 218 490 166 S710 112 805 166 S1020 218 1125 166" fill="none" stroke="#263653" stroke-width="8" stroke-linecap="round"/>
  <path d="M155 166 C320 112 370 218 490 166 S710 112 805 166 S1020 218 1125 166" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="24 18"><animate attributeName="stroke-dashoffset" values="84;0" dur="4s" repeatCount="indefinite"/></path>
  <circle r="8" fill="#ffffff" filter="url(#soft)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g><circle cx="155" cy="166" r="18" fill="#2aa8ad"/><circle cx="155" cy="166" r="26" fill="none" stroke="#2aa8ad" opacity="0.35"><animate attributeName="r" values="22;34;22" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="3.5s" repeatCount="indefinite"/></circle><text x="155" y="216" fill="#f3f6fb" font-size="17" font-weight="700">Systems</text><text x="155" y="240" fill="#91a3c0" font-size="13">IT · infrastructure · security</text></g>
    <g><circle cx="490" cy="166" r="18" fill="#3d96bd"/><circle cx="490" cy="166" r="26" fill="none" stroke="#3d96bd" opacity="0.35"><animate attributeName="r" values="22;34;22" dur="3.5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></circle><text x="490" y="216" fill="#f3f6fb" font-size="17" font-weight="700">Data products</text><text x="490" y="240" fill="#91a3c0" font-size="13">SQL · Python · FastAPI · React</text></g>
    <g><circle cx="805" cy="166" r="18" fill="#586fc9"/><circle cx="805" cy="166" r="26" fill="none" stroke="#586fc9" opacity="0.35"><animate attributeName="r" values="22;34;22" dur="3.5s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="3.5s" begin="1.6s" repeatCount="indefinite"/></circle><text x="805" y="216" fill="#f3f6fb" font-size="17" font-weight="700">Quality systems</text><text x="805" y="240" fill="#91a3c0" font-size="13">GxP · ALCOA+ · CSV / CSA</text></g>
    <g><circle cx="1125" cy="166" r="18" fill="#7842df"/><circle cx="1125" cy="166" r="26" fill="none" stroke="#7842df" opacity="0.35"><animate attributeName="r" values="22;34;22" dur="3.5s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="3.5s" begin="2.4s" repeatCount="indefinite"/></circle><text x="1125" y="216" fill="#f3f6fb" font-size="17" font-weight="700">Measured impact</text><text x="1125" y="240" fill="#91a3c0" font-size="13">traceable · explainable · scalable</text></g>
  </g>
</svg>
